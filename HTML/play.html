    <link rel="stylesheet" href="style.css" />

<body class="bg-secondary text-dark">
    <header class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <a class="navbar-brand" href="#">Word Chain</a>
            <menu class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="play.html">Play</a>

    <main>
        <ul>
            <li>Timmothy finished a chain (tag -- fat)</li>
            <li>John finished a chain (bad -- dog)</li>
        </ul>

        <h3>Difficulty</h3>
        <ul>
            <li><button>3-letter</button></li>
            <li><button>4-letter</button></li>
        </ul>

        <button>give up</button>

        <div class="letter-grid">
            <div class="letter-cell">A</div>
            <div class="letter-cell">C</div>
            <div class="letter-cell">T</div>
            <div class="letter-cell">A</div>
            <div class="letter-cell">C</div>
            <div class="letter-cell">E</div>
            <div class="letter-cell"></div>
            <div class="letter-cell"></div>
            <div class="letter-cell"></div>
        </div>

        <h3>Target Chain</h3>
        <p><span id="start_word">ACT</span> -- <span id="end_word">APE</span></p>
    </main>

    <footer class="bg-dark text-light">
