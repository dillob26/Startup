<!DOCTYPE html>
<html>
    <title>Word Chain game</title>
</html>
<head>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="play.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">/>
</head>
<body class="bg-secondary text-dark">
    <header class="container-fluid">
        <nav class="navbar navbar-expand navbar-dark bg-dark fixed-top">
            <a class="navbar-brand" href="#">Word Chain</a>
            <menu class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="play.html">Play</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="leaderboard.html">Leaderboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="guide.html">guide</a>
                </li>
            </menu>
        </nav>
    </header>

    <main>


        <div class="options fixed-left">
            <h3>Difficulty</h3>
            <ul>
                <li><button class="btn btn-dark active">3-letter</button></li>
                <li><button class="btn btn-dark">4-letter</button></li>
            </ul>

            
        </div>

        <div class="game">
            <div class="title">
                <h3>Target Chain</h3>
                <p><span id="start_word">ACT</span> --> <span id="end_word">APE</span></p>
            </div>

            <div class="letter-grid">
                <div class="letter-cell">A</div>
                <div class="letter-cell">C</div>
                <div class="letter-cell">T</div>
                <div class="letter-cell">A</div>
                <div class="letter-cell">C</div>
                <div class="letter-cell">E</div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
                <div class="letter-cell"></div>
            </div>

            <div>
                <button class="btn btn-dark">give up</button>
                <button class="btn btn-dark">restart</button>
            </div>
        </div>

        <div class="notifications">    
            <ul>
                <li><span class="Name">Timmothy</span> finished a chain (tag -- fat)</li>
                <li><span class="Name">John</span> finished a chain (bad -- dog)</li>
            </ul>
        </div>
    </main>

    <footer class="bg-dark text-light">
        <div class="container-fluid">
            <p>
                Dillon Birch - <a href="https://github.com/dillob26/Startup">GitHub</a>
            </p>
        </div>    
    </footer>
</body>
